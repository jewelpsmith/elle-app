<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURYNELLE∞ IDEAS · Talk to Elle</title>
<meta name="description" content="Talk to Elle. Your coach, your hype girl, your study partner, your spark."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  min-height:100dvh;overflow-x:hidden;
  background:linear-gradient(180deg,#FEFEFE 0%,#FFF9F9 30%,#F9FAFF 60%,#FEFEFE 100%);
  font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#333;
}
.confetti{position:fixed;border-radius:50%;pointer-events:none;animation:floatDot 15s ease-in-out infinite;}
@keyframes floatDot{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-20px) scale(1.1);}}
@keyframes dotPulse{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-5px);}}
@keyframes breathe{0%,100%{box-shadow:0 20px 50px -20px rgba(255,107,157,0.35);}50%{box-shadow:0 24px 60px -20px rgba(255,107,157,0.5);}}

.wrap{max-width:1140px;margin:0 auto;min-height:100dvh;display:grid;
  grid-template-columns:1fr 1.1fr;gap:30px;align-items:center;padding:32px 24px;}

/* portrait side */
.portrait{position:relative;}
.frame{border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 20px 50px -20px rgba(255,107,157,0.35);
  animation:breathe 5s ease-in-out infinite;}
.frame img{display:block;width:100%;height:auto;}
.frame::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(30,15,40,0.5),transparent 50%);pointer-events:none;}
.nameplate{position:absolute;left:20px;bottom:16px;color:#fff;z-index:2;
  text-shadow:0 2px 12px rgba(0,0,0,0.4);}
.nameplate .n{font-family:'Bangers',cursive;font-size:36px;
  background:linear-gradient(90deg,#FF6B9D,#FF8C42,#FFCC00,#4CD964,#5AC8FA,#9B6BFF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:1px rgba(0,0,0,0.3);filter:drop-shadow(1px 2px 0 rgba(0,0,0,0.3));}
.nameplate .b{font-family:'Fraunces',serif;font-size:11px;letter-spacing:.12em;opacity:.85;margin-top:2px;}
.nameplate .b .inf{color:#F0C877;}
.idle{position:absolute;font-size:18px;opacity:0;pointer-events:none;z-index:3;
  animation:twinkle 3.4s ease-in-out infinite;}
.idle.a{top:6%;right:8%;animation-delay:.3s;color:#FF6B9D;}
.idle.b{top:42%;right:3%;animation-delay:1.6s;font-size:14px;color:#FFCC00;}
.idle.c{top:78%;left:5%;animation-delay:2.5s;font-size:16px;color:#5AC8FA;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6);}50%{opacity:.9;transform:scale(1);}}

/* chat side */
.panel{display:flex;flex-direction:column;height:min(90dvh,740px);position:relative;z-index:1;}
.head{text-align:center;margin-bottom:16px;}
.logo{font-family:'Fraunces',serif;font-size:12px;letter-spacing:.14em;color:#ccc;}
.logo span{color:#FF8C42;}
.title-wrap{position:relative;display:inline-block;padding:6px 16px;}
.splash{position:absolute;border-radius:50%;filter:blur(6px);z-index:1;}
.sp1{top:-8px;left:-4px;width:34px;height:34px;background:#FF6B9D;opacity:.45;}
.sp2{top:4px;right:-6px;width:28px;height:28px;background:#5AC8FA;opacity:.45;}
.sp3{bottom:-6px;left:30%;width:30px;height:16px;background:#FFCC00;opacity:.45;}
.sp4{top:-4px;left:42%;width:20px;height:20px;background:#9B6BFF;opacity:.4;}
.sp5{bottom:-4px;right:18%;width:24px;height:24px;background:#4CD964;opacity:.35;}
h1{font-family:'Bangers',cursive;font-size:52px;font-weight:400;line-height:1;
  letter-spacing:.04em;position:relative;z-index:2;
  background:linear-gradient(90deg,#FF6B9D,#FF8C42,#FFCC00,#4CD964,#5AC8FA,#9B6BFF,#FF2D78);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:1.5px #222;filter:drop-shadow(2px 3px 0px rgba(0,0,0,.25));}
.sub{font-size:13px;color:#999;margin-top:4px;}

.tabs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:14px;}
.tab{display:flex;align-items:center;gap:4px;padding:7px 13px;border-radius:999px;
  font-size:12px;font-weight:600;font-family:'Figtree',sans-serif;
  cursor:pointer;transition:all .2s ease;border:2px solid;}
.tab:hover{filter:brightness(1.05);}.tab:active{transform:scale(.97);}

.card{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:24px;
  padding:18px 18px 16px;
  box-shadow:0 8px 40px -12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);
  border-top:3px solid #FF6B9D;overflow:hidden;}

.thread{flex:1;display:flex;flex-direction:column;gap:11px;overflow-y:auto;padding:4px 2px 8px;
  scrollbar-width:thin;scrollbar-color:#eee transparent;}
.thread::-webkit-scrollbar{width:5px;}
.thread::-webkit-scrollbar-thumb{background:#eee;border-radius:10px;}
.msg-wrap{display:flex;width:100%;}
.bubble{max-width:88%;padding:12px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
.elle-name{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.dots-typing{display:flex;gap:6px;padding:4px 0;}
.dots-typing span{width:7px;height:7px;border-radius:50%;animation:dotPulse 1.4s ease infinite;}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.chip{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;
  font-family:'Figtree',sans-serif;cursor:pointer;transition:all .15s ease;border:1.5px solid;}
.chip:hover{filter:brightness(1.05);}.chip:active{transform:scale(.97);}

.comp{display:flex;gap:8px;margin-top:12px;align-items:center;}
.input-box{flex:1;display:flex;background:#FAFAFA;border:2px solid #eee;border-radius:14px;
  padding:3px 5px 3px 14px;transition:border-color .2s;}
.input-box:focus-within{border-color:#FF6B9D44;}
input.say{flex:1;border:none;outline:none;background:transparent;
  font-family:'Figtree',sans-serif;font-size:14px;color:#333;padding:9px 0;}
input.say::placeholder{color:#bbb;}
.send-btn{width:42px;height:42px;flex-shrink:0;border:none;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;transition:all .15s ease;}
.send-btn:hover{filter:brightness(1.1);}.send-btn:active{transform:scale(.95);}
.send-btn svg{width:18px;height:18px;}

.footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;
  font-size:11px;color:#ccc;}
.footer a{color:#ccc;text-decoration:none;}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:18px;padding:18px 14px 30px;}
  .frame{max-width:400px;margin:0 auto;}
  .panel{height:auto;min-height:60dvh;}
  h1{font-size:40px;}
  .tabs{gap:5px;}.tab{font-size:11px;padding:6px 10px;}
}
</style>
</head>
<body>

<div class="wrap">
  <!-- portrait -->
  <div class="portrait">
    <span class="idle a">&#10022;</span>
    <span class="idle b">&#10022;</span>
    <span class="idle c">&#10022;</span>
    <div class="frame">
      <img src="elle.png" alt="Elle, the heart of AURYNELLE IDEAS"/>
      <div class="nameplate">
        <div class="n">Elle</div>
        <div class="b">&Lambda;URYNELLE<span class="inf">&infin;</span> IDE&Lambda;S</div>
      </div>
    </div>
  </div>

  <!-- chat -->
  <div class="panel">
    <div class="head">
      <div class="logo">&Lambda;URYNELLE<span>&infin;</span> IDE&Lambda;S</div>
      <div class="title-wrap">
        <div class="splash sp1"></div><div class="splash sp2"></div>
        <div class="splash sp3"></div><div class="splash sp4"></div><div class="splash sp5"></div>
        <h1>Talk to Elle</h1>
      </div>
      <p class="sub">Your coach, your hype girl, your study partner, your spark ✦</p>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="card" id="card">
      <div class="thread" id="thread"></div>
      <div class="chips" id="chips"></div>
      <div class="comp">
        <div class="input-box">
          <input class="say" id="say" type="text" placeholder="Say something to Elle..." autocomplete="off"/>
        </div>
        <button class="send-btn" id="sendBtn" style="background:#FF6B9D;box-shadow:0 6px 20px -6px rgba(255,107,157,.7);color:#fff;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>

    <div class="footer">
      <a href="https://buymeacoffee.com/aurynelle">buymeacoffee.com/aurynelle</a>
      <span style="opacity:.3;">&middot;</span>
      <a href="https://jewelpsmith.github.io/aurynelle">jewelpsmith.github.io/aurynelle</a>
    </div>
  </div>
</div>

<script>
const MODES=[
  {id:"chat",emoji:"💬",label:"Talk",color:"#FF6B9D"},
  {id:"quiz",emoji:"🧠",label:"Quiz me",color:"#9B6BFF"},
  {id:"breakdown",emoji:"⚡",label:"Break it down",color:"#FF8C42"},
  {id:"ideas",emoji:"💡",label:"Ideas",color:"#FFCC00"},
  {id:"study",emoji:"📖",label:"Study coach",color:"#4CD964"},
  {id:"connect",emoji:"🤝",label:"Connect",color:"#5AC8FA"}
];
const CHIPS={
  chat:["Hype me up ✦","I need a word 🙏","I had a win! 🎉","I'm going through it 💛"],
  quiz:["Quiz me on PMP","Test my grammar","Science questions","Random trivia 🎲"],
  breakdown:["Study for my exam","Write a paper","Start a business","Plan my week 📋"],
  ideas:["YouTube video ideas","Side hustle ideas","Content ideas","Creative projects ✨"],
  study:["I have 1 hour","I keep forgetting things","I can't focus 😩","Help me make a plan"],
  connect:["I need a tutor","I want to offer a service","Book a live session","Career coaching 💼"]
};
const GREETS={
  chat:"Hey gorgeous! ✦ Come sit with me. Talk, vent, celebrate, or just breathe. I'm here and I'm not going anywhere 💕",
  quiz:"Ooh okay, big brain time! 🧠 What do you want me to quiz you on? Pick a topic or type your own!",
  breakdown:"Tell me the big scary thing. ⚡ I'm about to chop it into pieces so small you'll wonder why you were ever worried, love.",
  ideas:"Let's brainstorm! 💡 Give me a topic and I'll throw sparks at you until something catches fire 🔥",
  study:"Let's get you set up to actually remember this 📖 What are you studying and how much time do you have? Be real with me.",
  connect:"Looking to connect with someone real? 🤝 Tell me what you need, or if you're a provider wanting to offer your services through AURYNELLE!"
};
const BCOL=["#FF6B9D","#9B6BFF","#5AC8FA","#4CD964","#FF8C42"];

let mode="chat",history=[],loading=false,bIdx=0;
const thread=document.getElementById("thread"),say=document.getElementById("say"),
  sendBtn=document.getElementById("sendBtn"),card=document.getElementById("card");

(function(){
  const cols=["#FF6B9D","#9B6BFF","#5AC8FA","#4CD964","#FF8C42","#FFCC00","#FF2D78","#FFB6C1"];
  for(let i=0;i<18;i++){const d=document.createElement("div");d.className="confetti";
    const s=8+Math.random()*32;
    Object.assign(d.style,{width:s+"px",height:s+"px",left:Math.random()*100+"%",top:Math.random()*100+"%",
      background:cols[i%8],opacity:(.08+Math.random()*.12),
      animationDelay:(Math.random()*8)+"s",animationDuration:(12+Math.random()*10)+"s"});
    document.body.appendChild(d);}
})();

function renderTabs(){
  const el=document.getElementById("tabs");el.innerHTML="";
  MODES.forEach(m=>{const b=document.createElement("button");b.className="tab";
    b.innerHTML=`<span>${m.emoji}</span> ${m.label}`;const a=mode===m.id;
    Object.assign(b.style,{background:a?m.color:"#fff",color:a?"#fff":m.color,borderColor:m.color,
      boxShadow:a?`0 4px 18px -4px ${m.color}88`:"0 2px 8px -4px rgba(0,0,0,.08)",
      transform:a?"scale(1.05)":"scale(1)"});
    b.onclick=()=>{mode=m.id;history=[];bIdx=0;thread.innerHTML="";
      renderTabs();renderChips();updateAccent();addBubble("elle",GREETS[mode]);};
    el.appendChild(b);});
}
function updateAccent(){const c=MODES.find(m=>m.id===mode).color;
  card.style.borderTop=`3px solid ${c}`;sendBtn.style.background=c;
  sendBtn.style.boxShadow=`0 6px 20px -6px ${c}99`;}
function renderChips(){const el=document.getElementById("chips");el.innerHTML="";
  const c=MODES.find(m=>m.id===mode).color;
  (CHIPS[mode]||[]).forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;
    Object.assign(b.style,{borderColor:c+"44",color:c,background:c+"0A"});
    b.onclick=()=>doSend(t);el.appendChild(b);});}

function addBubble(role,text){
  const wrap=document.createElement("div");wrap.className="msg-wrap";
  wrap.style.justifyContent=role==="you"?"flex-end":"flex-start";
  const bub=document.createElement("div");bub.className="bubble";
  const ci=bIdx%BCOL.length;const mc=MODES.find(m=>m.id===mode).color;
  if(role==="elle"){bub.style.background=`linear-gradient(135deg,${BCOL[ci]}22,${BCOL[ci]}08)`;
    bub.style.borderLeft=`3px solid ${BCOL[ci]}`;bub.style.borderRadius="4px 20px 20px 20px";
    bub.style.boxShadow=`0 6px 28px -8px ${BCOL[ci]}40`;
    const nm=document.createElement("div");nm.className="elle-name";nm.textContent="Elle ✦";
    nm.style.color=BCOL[ci];bub.appendChild(nm);
  }else{bub.style.background=`linear-gradient(135deg,${mc}18,${mc}08)`;
    bub.style.borderRight=`3px solid ${mc}`;bub.style.borderRadius="20px 4px 20px 20px";
    bub.style.boxShadow=`0 6px 28px -8px ${mc}33`;}
  const tx=document.createElement("div");tx.style.whiteSpace="pre-wrap";tx.textContent=text;
  bub.appendChild(tx);wrap.appendChild(bub);thread.appendChild(wrap);
  thread.scrollTop=thread.scrollHeight;}

function showTyping(){const wrap=document.createElement("div");wrap.className="msg-wrap";wrap.id="typing-wrap";
  wrap.style.justifyContent="flex-start";const mc=MODES.find(m=>m.id===mode).color;
  const bub=document.createElement("div");bub.className="bubble";
  bub.style.background=`linear-gradient(135deg,${mc}22,${mc}08)`;
  bub.style.borderLeft=`3px solid ${mc}`;bub.style.borderRadius="4px 20px 20px 20px";
  const nm=document.createElement("div");nm.className="elle-name";nm.textContent="Elle ✦";nm.style.color=mc;
  bub.appendChild(nm);const dots=document.createElement("div");dots.className="dots-typing";
  for(let i=0;i<3;i++){const s=document.createElement("span");s.style.background=mc;
    s.style.animationDelay=(i*.2)+"s";dots.appendChild(s);}
  bub.appendChild(dots);wrap.appendChild(bub);thread.appendChild(wrap);thread.scrollTop=thread.scrollHeight;}
function hideTyping(){const t=document.getElementById("typing-wrap");if(t)t.remove();}

async function callAPI(text){
  const hint=`[Mode: ${MODES.find(m=>m.id===mode).label}] `;
  history.push({role:"user",content:hint+text});
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:history})});
    const d=await r.json();
    const reply=d.content?.map(c=>c.text||"").join("")||"Something hiccupped, love. Try again for me? 💕";
    history.push({role:"assistant",content:reply});return reply;
  }catch{return "Ooh, something went sideways gorgeous. One more try? ✨";}
}

async function doSend(text){const v=(text||say.value).trim();if(!v||loading)return;say.value="";
  addBubble("you",v);loading=true;showTyping();
  const reply=await callAPI(v);hideTyping();bIdx++;addBubble("elle",reply);
  loading=false;say.focus();}

sendBtn.addEventListener("click",()=>doSend());
say.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doSend();}});
renderTabs();renderChips();updateAccent();addBubble("elle",GREETS[mode]);say.focus();
</script>
</body>
</html>
